# Mihon Web: deployment-managed; not an NPM UI database record.
# Restore from repository ops/mihon-web.nginx.conf after NPM data recovery.
server {
  listen 80;
  listen [::]:80;
  server_name mg.namiza.id;
  include conf.d/include/letsencrypt-acme-challenge.conf;
  location / { return 301 https://$host$request_uri; }
}
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name mg.namiza.id;
  ssl_certificate /etc/letsencrypt/live/mihon-web/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/mihon-web/privkey.pem;
  include conf.d/include/ssl-cache.conf;
  include conf.d/include/ssl-ciphers.conf;
  client_max_body_size 32m;
  # Trust CF-Connecting-IP ONLY when the TCP peer is an official Cloudflare edge.
  # This server-level list replaces NPM's broader inherited real-IP trust list.
  real_ip_header CF-Connecting-IP;
  real_ip_recursive on;
  set_real_ip_from 173.245.48.0/20;
  set_real_ip_from 103.21.244.0/22;
  set_real_ip_from 103.22.200.0/22;
  set_real_ip_from 103.31.4.0/22;
  set_real_ip_from 141.101.64.0/18;
  set_real_ip_from 108.162.192.0/18;
  set_real_ip_from 190.93.240.0/20;
  set_real_ip_from 188.114.96.0/20;
  set_real_ip_from 197.234.240.0/22;
  set_real_ip_from 198.41.128.0/17;
  set_real_ip_from 162.158.0.0/15;
  set_real_ip_from 104.16.0.0/13;
  set_real_ip_from 104.24.0.0/14;
  set_real_ip_from 172.64.0.0/13;
  set_real_ip_from 131.0.72.0/22;
  set_real_ip_from 2400:cb00::/32;
  set_real_ip_from 2606:4700::/32;
  set_real_ip_from 2803:f800::/32;
  set_real_ip_from 2405:b500::/32;
  set_real_ip_from 2405:8100::/32;
  set_real_ip_from 2a06:98c0::/29;
  set_real_ip_from 2c0f:f248::/32;
  resolver 127.0.0.11 valid=10s;
  set $mihon_upstream http://mihon-web:8080;
  location / {
    proxy_pass $mihon_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Overwrite caller input; Go accepts this only from the pinned NPM peer.
    proxy_set_header X-Mihon-Client-IP $remote_addr;
    proxy_connect_timeout 5s;
    proxy_read_timeout 180s;
    proxy_buffering off;
  }
}
